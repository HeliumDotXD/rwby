plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

def requestedTasks = gradle.startParameter.taskNames
def isBuildInvocation = requestedTasks.any { it == "build" || it.endsWith(":build") }
def propertiesFile = file("gradle.properties")
def propertiesContent = propertiesFile.getText("UTF-8")
def versionMatcher = (propertiesContent =~ /(?m)^mod_version=(\d+)\.(\d+)\.(\d+)$/)
if (!versionMatcher.find()) {
	throw new GradleException("Could not find mod_version=x.y.z in gradle.properties")
}

def resolvedVersion = "${versionMatcher.group(1)}.${versionMatcher.group(2)}.${versionMatcher.group(3)}"
if (isBuildInvocation) {
	int major = versionMatcher.group(1) as int
	int minor = versionMatcher.group(2) as int
	int patch = versionMatcher.group(3) as int
	resolvedVersion = "${major}.${minor}.${patch + 1}"
	String updated = propertiesContent.replaceFirst(/(?m)^mod_version=\d+\.\d+\.\d+$/, "mod_version=${resolvedVersion}")
	propertiesFile.write(updated, "UTF-8")
	logger.lifecycle("Bumped mod_version to ${resolvedVersion}")
}

version = resolvedVersion
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url "https://maven.ladysnake.org/releases" }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"rwby" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "org.ladysnake:satin:${project.satin_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
	modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def modrinthModsDir = "/Users/johann/Library/Application Support/ModrinthApp/profiles/Testing/mods"

tasks.register("deployToTestingMods", Copy) {
	dependsOn(tasks.named("remapJar"))
	from(tasks.named("remapJar").flatMap { it.archiveFile })
	into(file(modrinthModsDir))
	doFirst {
		file(modrinthModsDir).mkdirs()
	}
}

tasks.named("build") {
	finalizedBy(tasks.named("deployToTestingMods"))
}
